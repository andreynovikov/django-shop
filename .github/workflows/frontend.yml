name: Frontend CI

# Every push to the branch is checked and built into an image.
# "Run workflow" on the branch deploys the image of its head commit to production.
# The default branch has a stub of this file, which GitHub needs to show that button.
on:
  push:
    branches:
      - "dortak"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dortak

jobs:

  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # typegen writes the route types (PageProps, LayoutProps) that the code is checked against
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit

  build:
    needs: check
    runs-on: ubuntu-latest
    # The .env is baked into the image, so the build takes the production environment's ENV_FILE
    environment:
      name: dortak
      deployment: false
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The commit's date in Moscow time and its short hash, e.g. 2026.11.11-7f57710.
      # The deploy job computes the same tag.
      - name: Image version
        id: version
        run: echo "version=$(TZ=Europe/Moscow git log -1 --format=%cd --date=format-local:%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::The dortak environment has no ENV_FILE secret"
            exit 1
          fi
          printf '%s\n' "$ENV_FILE" > .env

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The version tag has the highest priority, so it also goes into the image's version label
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},priority=1000
            type=raw,value=latest

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            entity=dortak
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dortak
    concurrency: deploy-dortak
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The same tag as the build job's
      - name: Image version
        id: version
        run: echo "version=$(TZ=Europe/Moscow git log -1 --format=%cd --date=format-local:%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            REF=${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            trap 'docker logout ghcr.io' EXIT
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            if ! docker pull "$REF"; then
              echo "No image $REF: wait for the push build of this commit to finish, or check whether it failed"
              exit 1
            fi
            cd /www/dor-tak.ru
            NAME=dortak PORT=4005 IMAGE="$REF" docker compose up -d
