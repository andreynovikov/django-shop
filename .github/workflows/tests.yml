name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  flake8:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - run: uv run --locked --only-dev flake8

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # Production's major version. The client tools installed below must match it.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shop

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install system packages
        # pylibmc has no wheel for Python 3.13 and is built against libmemcached. RestoreTests in
        # tests/test_backup_db.py need jq and the PostgreSQL client tools, and skip themselves without them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmemcached-dev zlib1g-dev jq postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"

      - name: Install restic
        # backup_db uses --stdin-from-command, which restic has since 0.17. Ubuntu 24.04 has 0.16.
        working-directory: ${{ runner.temp }}
        env:
          VERSION: 0.18.0
          SHA256: 98f6dd8bf5b59058d04bfd8dab58e196cc2a680666ccee90275a3b722374438e
        run: |
          curl -fsSL -o restic.bz2 "https://github.com/restic/restic/releases/download/v$VERSION/restic_${VERSION}_linux_amd64.bz2"
          echo "$SHA256  restic.bz2" | sha256sum -c -
          bunzip2 restic.bz2
          sudo install -m 755 restic /usr/local/bin/restic

      - name: Install Python packages
        run: uv sync --locked

      - name: Run tests
        run: uv run --no-sync python manage.py test tests errors --settings=tests.settings
