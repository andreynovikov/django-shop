# Reads the secrets of a production server set up by hand, for export-secrets.sh, which encrypts them into
# group_vars/production/secrets.yml. See "Secrets" in README.md.
- name: Export the secrets of the production server
  hosts: production
  become: true
  gather_facts: false
  tasks:
    - name: Read the secrets
      ansible.builtin.import_role:
        name: server
        tasks_from: export_secrets.yml
