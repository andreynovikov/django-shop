server_packages:
  - sudo
  - exim4
  - rsync
  - python3
  - postgresql-client
  - nginx
  - libnginx-mod-http-brotli-filter
  - uwsgi
  - uwsgi-plugin-python3
  - memcached
  - redis-server
  - certbot
  - git
  # the uv installer download with curl, Ansible needs acl to become an unprivileged user, timesyncd and hwclock
  # (util-linux-extra, for setting the timezone) are not installed everywhere
  - curl
  - acl
  - systemd-timesyncd
  - util-linux-extra

# for building Python packages
server_build_packages:
  - build-essential
  - python3-dev
  - libmemcached-dev
  - libpq-dev
  - libjpeg-dev
  - tidy

server_optional_packages:
  - less
  - emacs-nox
  - bind9-dnsutils
  - htop
  - apache2-utils

server_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Created in this order to preserve their uids. Each user may also have ssh_keys, a list of public keys, and
# password, a crypt hash that is set only when the user is created.
server_users:
  - name: andrey
    groups: [adm, docker, sudo, www-data, sworld]
  - name: nikolays
    groups: [adm, sudo, www-data]
  - name: maria
    groups: [www-data]
  - name: egor
    groups: [www-data]

# The system user for uWSGI, Celery, backups and storefronts, see "Service user" in deploy/README.md
server_app_user: sworld

# Deployment names and directories. The source branch defaults to the deployment name. feeds: the branch has XML feed
# templates in templates/xml, which the first rollout copies into the directory. latest: the first rollout starts the
# latest build, where the others start the image that Run workflow deployed last.
server_frontend_sites:
  sworld: { directory: /www/www.sewing-world.ru, port: 4104, feeds: true }
  stage: { directory: /www/cartzilla.sigalev.ru, port: 4004, branch: sworld, feeds: true, latest: true }
  family: { directory: /www/familysew.ru, port: 4101 }
  singer: { directory: /www/singer.ru, port: 4102 }
  janome: { directory: /www/janome.club, port: 4103 }
  dortak: { directory: /www/dor-tak.ru, port: 4105 }

# The image tag of a deployment's first start, by deployment name, in place of the one chosen as above
server_frontend_tags: {}

# The repository the backend is cloned from and the registry of the storefront images. Both are set in the inventory,
# see inventory.example.yml.
server_git_repository: ""
server_frontend_registry: ""
# The repository on GitHub as owner/name, where the first start of a storefront looks up what production runs
server_github_repository: >-
  {{ server_git_repository | regex_replace('^.*github[.]com[:/]', '') | regex_replace('([.]git)?/?$', '')
     if 'github.com' in server_git_repository else '' }}
# The branch the backend sites are cloned from
server_backend_branch: main

# AllowUsers of sshd lists server_users and these. Add the user GitHub Actions deploys with if it is not one of them.
server_ssh_extra_users: [deploy]

# false skips the "Firewall" section, where the hosting's firewall filters the traffic instead. It must then allow
# what the variables below allow. The section does not undo nftables when it is turned off.
server_firewall: true
# Open to everyone, besides the loopback, docker0, ICMP and DHCP
server_firewall_tcp_ports: [22, 80, 443]
server_firewall_udp_ports: [443]  # HTTP/3
# More nftables rules for the input chain
server_firewall_rules:
  # The hosting's Zabbix servers, from /etc/zabbix/zabbix_agentd.conf
  - ip saddr { 92.53.116.12, 92.53.116.111, 92.53.116.119 } tcp dport 10050 accept

server_timezone: Europe/Moscow
server_ntp: ru.pool.ntp.org
# Megabytes, memcached -m
server_memcached_memory: 256

# Bundled sites to enable. The Debian package ships a different default server.
server_nginx_directory: /etc/nginx
server_nginx_sites_enabled:
  - admin.sewing-world.ru.conf
  - api.sewing-world.ru.conf
  - default.conf
  - dor-tak.ru.conf
  - familysew.ru.conf
  - janome.club.conf
  - singer.ru.conf
  - stage.sewing-world.ru.conf
  - www.sewing-world.ru.conf
server_nginx_sites_disabled: [default, dev.sigalev.ru.conf]
server_nginx_sites_removed: [stats.sewing-world.ru.conf]

# Owner of /www, where the sites live
server_www_owner: andrey

# uWSGI apps, an ini file in /etc/uwsgi/apps-available each. Their units start once /www/<site>/.venv exists.
# processes and threads default to 2 and 4, harakiri to 60 seconds, options adds more lines to the ini file.
# The API runs mostly Python, which one process runs on one core at a time, so prod has more processes rather than
# more threads. Keep harakiri a little shorter than nginx's uwsgi_read_timeout for the app.
server_uwsgi_apps:
  - name: prod
    site: www.sewing-world.ru
    processes: 6
    stats: 127.0.0.1:9191
  # Exports, labels and 1C files take longer
  - name: admin
    site: www.sewing-world.ru
    admin: true
    harakiri: 300
  # Reload it after a pull with touch /www/dev.sigalev.ru/.touch_reload
  - name: dev
    site: dev.sigalev.ru
    processes: 1
    threads: 2

# ASGI apps (uvicorn), /etc/asgi/<name> each, for what keeps a connection open: the admin's instant notices, which
# nginx passes to the socket /run/asgi/<name>.socket. The site must be one of the uWSGI apps'.
server_asgi_apps:
  - name: admin_events
    site: www.sewing-world.ru
    admin: true

# Celery workers and beat, /etc/celery/<name>_worker and <name>_beat each. Their units start once
# /www/<site>/.venv exists. nodes maps each node of celery multi to its queues.
server_celery_apps:
  - name: prod
    site: www.sewing-world.ru
    nodes:
      priority: priority
      import: import
      integrations: integrations
      revalidation: revalidation
      default: default,celery
    options: >-
      --loglevel=INFO --verbose --events --time-limit=300
      --concurrency=2 --concurrency:priority,integrations=4 --concurrency:import=1

# What the service user writes in a deployed site, with the mode of each directory. logs is the service user's
# alone: nginx writes its logs to /var/log/nginx, see "Nginx setup" in deploy/README.md.
server_app_directories:
  logs: "2755"
  media: "2775"
  static: "2775"
  .cache: "2775"
  import: "2775"
# The secrets only the service user and root may read
server_app_secrets:
  - .env
  - .env.admin

# Deployments in /www that back up their database hourly, one per database, and deployments that only save their
# config daily
server_db_backup_deployments: []
server_db_backup_config_deployments: []

# The host that holds the backup repository password, the first one of the inventory group "backup". Without it the
# "Database backups" section is skipped, so leave the group empty until the backup host is ready.
server_backup_password_host: "{{ (groups['backup'] | default([]) | first) | default('', true) }}"

# The TLS certificates of the nginx sites by name, which is the first domain of each, with the directory whose
# .well-known/ the site serves. The other domains of a certificate, redirected to the site, are its aliases in
# server_certificate_aliases of the inventory. A run requests a certificate an enabled site lacks, and expands one that
# lacks an alias, see "TLS certificates" in deploy/README.md.
server_certificates:
  www.sewing-world.ru: /www/www.sewing-world.ru
  admin.sewing-world.ru: /www/www.sewing-world.ru
  api.sewing-world.ru: /www/www.sewing-world.ru
  stage.sewing-world.ru: /www/cartzilla.sigalev.ru
  janome.club: /www/janome.club
  singer.ru: /www/singer.ru
  dor-tak.ru: /www/dor-tak.ru
  familysew.ru: /www/familysew.ru
  dev.sigalev.ru: /www/dev.sigalev.ru
server_certificate_aliases: {}
# Let's Encrypt's account email, optional
server_certbot_email: ""
# Tests point these at a local ACME server. Never on a real server: the certificates it issues would count as present
# and stay.
server_certbot_server: https://acme-v02.api.letsencrypt.org/directory
server_certbot_extra_args: []
