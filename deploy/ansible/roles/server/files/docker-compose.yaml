# Stage has its own Compose project but uses the sworld storefront branch.
name: ${NAME}
services:
  app:
    container_name: nextjs-${NAME}
    image: ${IMAGE}
    # Only for the emergency local build in deploy/README.md; deploy-frontend runs the CI image with --no-build
    build:
      context: ${BUILD_CONTEXT:-.}
      target: runner
      args:
        entity: "${STOREFRONT_BRANCH:?Set STOREFRONT_BRANCH}"
      secrets:
        - storefront_env
    # The image has no configuration: Next.js reads it from .env.local, which the storefront's startup.sh requires.
    # The file stays root:sworld 0640 on the host, and the container runs as sworld.
    secrets:
      - source: storefront_env
        target: /app/.env.local
    volumes:
      # Host nginx serves the static files that the container publishes here.
      - ./.docker/:/app/.docker/
      - ./templates/:/app/templates/
    network_mode: bridge
    ports:
      # Host nginx is the public entry point for every storefront.
      - "127.0.0.1:${PORT}:3000/tcp"
    environment:
      NODE_ENV: production
      STOREFRONT_PROCESS_NAME: "${NAME}"
      STOREFRONT_UID: "${STOREFRONT_UID:-}"
      STOREFRONT_GID: "${STOREFRONT_GID:-}"
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: unixgram:///run/systemd/journal/dev-log
        tag: "{{.Name}}/{{.ID}}"

secrets:
  # The storefront's configuration, the same as the ENV_FILE secret of its GitHub environment
  storefront_env:
    file: ./.env.storefront
