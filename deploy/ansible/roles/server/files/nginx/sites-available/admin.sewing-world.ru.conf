server {
  listen       80;
  server_name  admin.sewing-world.ru;
  return       301 https://admin.sewing-world.ru$request_uri;
}

server {
  listen       443 ssl;
  listen       443 quic;
  http2        on;
  server_name  admin.sewing-world.ru;

  ssl_certificate     /etc/letsencrypt/live/admin.sewing-world.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.sewing-world.ru/privkey.pem;

  include snippets/security-headers.conf;

  access_log   off;
  error_log    /var/log/nginx/admin.sewing-world.ru_error.log;

  client_max_body_size 10M;

  error_page 403 /403.html;

  location /403.html {
    root /www/www.sewing-world.ru;
    allow all;
  }

  location /static/ {
    alias /www/www.sewing-world.ru/static/;
    include snippets/open-file-cache.conf;
    expires 14d;
    add_header Cache-Control public;
    include snippets/security-headers.conf;
  }

  location /media/ {
    alias /www/www.sewing-world.ru/media/;
    include snippets/open-file-cache.conf;
  }

  location /images/ {
    alias /www/www.sewing-world.ru/images/;
  }

  location /.well-known/ {
    alias /www/www.sewing-world.ru/.well-known/;
  }

  # The admin's instant notices: event streams that stay open, so the ASGI app admin_events serves them, not the few
  # uWSGI workers (server_asgi_apps in defaults/main.yml, sewingworld/admin_events.py)
  location = /admin/events/ {
    proxy_pass http://unix:/run/asgi/admin_events.socket;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    # A stream sends a comment every 15 seconds and ends every 10 minutes
    proxy_read_timeout 1h;
  }

  location / {
    root /www/www.sewing-world.ru;
    uwsgi_pass unix:///var/run/uwsgi/admin.socket;
    include uwsgi_params;
    # A little longer than the admin app's harakiri, see server_uwsgi_apps in defaults/main.yml
    uwsgi_read_timeout 310s;
    uwsgi_buffer_size 16k;
    uwsgi_buffers 16 16k;
    # when a client closes the connection then keep the channel to uwsgi open. Otherwise uwsgi throws an IOError
    uwsgi_ignore_client_abort on;

    rewrite ^/favicon.ico /static/favicon.ico last;
    rewrite ^/robots.txt /static/robots.txt last;
  }

  location = / {
    return 301 https://$host/admin/;
  }
}
