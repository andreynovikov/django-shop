server {
  listen       80;
  server_name  api.sewing-world.ru;
  return       301 https://api.sewing-world.ru$request_uri;
}

server {
  listen       443 ssl;
  listen       443 quic;
  http2        on;
  server_name  api.sewing-world.ru;

  ssl_certificate     /etc/letsencrypt/live/api.sewing-world.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.sewing-world.ru/privkey.pem;

  include snippets/security-headers.conf;

  access_log   /var/log/nginx/api.sewing-world.ru_access.log;
  error_log    /var/log/nginx/api.sewing-world.ru_error.log;

  location /media/ {
    alias /www/www.sewing-world.ru/media/;
    access_log off;
    expires 14d;
    add_header Cache-Control "public";
    include snippets/security-headers.conf;
  }

  location /.well-known/ {
    alias /www/www.sewing-world.ru/.well-known/;
  }

  location /api/v0/ {
    root /www/www.sewing-world.ru;
    uwsgi_pass unix:///var/run/uwsgi/prod.socket;
    include uwsgi_params;
    uwsgi_read_timeout 65s;
    uwsgi_buffer_size 16k;
    uwsgi_buffers 16 16k;
    # when a client closes the connection then keep the channel to uwsgi open. Otherwise uwsgi throws an IOError
    uwsgi_ignore_client_abort on;
  }

  location /403.html {
    root /www/www.sewing-world.ru;
    allow all;
  }

  location / {
    return 403;
    error_page 403 /403.html;
  }
}
