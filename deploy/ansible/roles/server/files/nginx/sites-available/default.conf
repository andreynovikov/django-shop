server {
  listen 80 default_server;

  # Requests for an unknown host name: close the connection without an answer
  location / {
    return 444;
  }
}

server {
  listen 443 default_server ssl;
  # reuseport may be set on one listen of an address and port only, the QUIC listens of the sites go without it
  listen 443 default_server quic reuseport;
  server_name _;
  # No certificate for unknown names: the TLS handshake fails
  ssl_reject_handshake on;
}
