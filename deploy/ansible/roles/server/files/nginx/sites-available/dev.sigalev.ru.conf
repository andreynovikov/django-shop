server {
  listen       *:80;
  server_name  dev.sigalev.ru;
  rewrite ^(.*) https://dev.sigalev.ru$1 permanent;
}

server {
  listen       *:443 ssl;
  server_name  dev.sigalev.ru;

  ssl_certificate     /etc/letsencrypt/live/dev.sigalev.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.sigalev.ru/privkey.pem;

  access_log   /var/log/nginx/dev.sigalev.ru_access.log;
  error_log    /var/log/nginx/dev.sigalev.ru_error.log;

  include basic_auth;

  # temp for Django2 migration
  rewrite ^/i/b/(.*)$                                   /media/slides/$1 permanent;
  rewrite ^/images/(.*)$                                /media/images/$1 permanent;

  #client_max_body_size 2M;

  location ~ ^/(catalog\/menu.html|cgi-bin\/forum.cgi|wp-login.php) {
    log_not_found off;
    return 404;
  }

  location /static/ {
    alias /www/dev.sigalev.ru/static/;
  }

  location /media/ {
    alias /www/dev.sigalev.ru/media/;
  }

  location /.well-known/acme-challenge/ {
    auth_basic off;
    allow all;
    alias /www/dev.sigalev.ru/.well-known/acme-challenge/;
  }

  location / {
    root /www/dev.sigalev.ru;
    uwsgi_pass unix:///var/run/uwsgi/dev.socket;
    uwsgi_read_timeout 65s;
    include uwsgi_params;

    rewrite ^/favicon.ico /static/favicon.ico last;
    rewrite ^/robots.txt /static/robots.txt last;
  }
}
