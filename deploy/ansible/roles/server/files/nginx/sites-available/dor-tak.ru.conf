upstream dortak_frontend {
  server 127.0.0.1:4105;
  keepalive 16;
}

server {
  listen *:80;
  server_name  .dor-tak.com;
  server_name  .dor-tak.ru;
  return       301 https://$host$request_uri;
}

server {
  listen       *:443 ssl;
  server_name  *.dor-tak.ru;
  server_name  .dor-tak.com;

  ssl_certificate     /etc/letsencrypt/live/dor-tak.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dor-tak.ru/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  return       301 https://dor-tak.ru$request_uri;
}

server {
  listen       *:443 ssl;
  listen       443 quic;
  http2        on;
  server_name  dor-tak.ru;

  ssl_certificate     /etc/letsencrypt/live/dor-tak.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dor-tak.ru/privkey.pem;

  include snippets/security-headers.conf;

  access_log   /var/log/nginx/dor-tak.ru_access.log;
  error_log    /var/log/nginx/dor-tak.ru_error.log;

  location /.well-known/ {
    alias /www/dor-tak.ru/.well-known/;
  }

  location = /unavailable.html {
    root /www/dor-tak.ru/.docker/public;
    include snippets/storefront-unavailable.conf;
    include snippets/security-headers.conf;
  }

  rewrite ^/products/(.+).html$ /products/$1/ permanent;
  rewrite ^/shop/user/orders/(.*)$ /user/orders/$1 permanent;

  location /media/ {
    alias /www/www.sewing-world.ru/media/;
  }

  location /images/ {
    alias /www/www.sewing-world.ru/media/images/;
  }

  location /_next/static/ {
    alias /www/dor-tak.ru/.docker/static/;
    access_log off;
    expires max;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include snippets/security-headers.conf;
  }

  location / {
    root /www/dor-tak.ru/.docker/public;
    try_files $uri $uri/index.html @nextjs;
  }

  location /_next/image {
    proxy_pass http://dortak_frontend;
    include sw_proxy_params;
    proxy_cache next_image;
    proxy_cache_key $host$request_uri$image_format;
    proxy_cache_valid 200 30d;
    proxy_ignore_headers Cache-Control Expires Vary;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status;
    include snippets/security-headers.conf;
  }

  location @nextjs {
    proxy_pass http://dortak_frontend;
    include sw_proxy_params;
  }
}
