upstream janome_frontend {
  server 127.0.0.1:4103;
  keepalive 16;
}

server {
  listen *:80;
  server_name  .janome.club;
  server_name  .janome.market;
  return       301 https://$host$request_uri;
}

server {
  listen       *:443 ssl;
  server_name  www.janome.club;
  server_name  .janome.market;

  ssl_certificate     /etc/letsencrypt/live/janome.club/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/janome.club/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  return       301 https://janome.club$request_uri;
}

server {
  listen       *:443 ssl;
  listen       443 quic;
  http2        on;
  server_name  janome.club;

  ssl_certificate     /etc/letsencrypt/live/janome.club/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/janome.club/privkey.pem;

  include snippets/security-headers.conf;

  access_log   /var/log/nginx/janome.club_access.log combined buffer=64k flush=5s;
  error_log    /var/log/nginx/janome.club_error.log;

  location /.well-known/ {
    alias /www/janome.club/.well-known/;
  }

  location = /unavailable.html {
    root /www/janome.club/.docker/public;
    include snippets/storefront-unavailable.conf;
    include snippets/security-headers.conf;
  }

  include snippets/storefront-media.conf;

  location /_next/static/ {
    alias /www/janome.club/.docker/static/;
    access_log off;
    expires max;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include snippets/security-headers.conf;
  }

  # YooKassa payment links and notifications for the site, see yandex_kassa/urls.py
  location /kassa/ {
    root /www/www.sewing-world.ru;
    uwsgi_pass unix:///var/run/uwsgi/prod.socket;
    uwsgi_read_timeout 65s;
    include uwsgi_params;
    # when a client closes the connection then keep the channel to uwsgi open. Otherwise uwsgi throws an IOError
    uwsgi_ignore_client_abort on;
  }

  location / {
    root /www/janome.club/.docker/public;
    try_files $uri $uri/index.html @nextjs;
  }

  location /_next/image {
    proxy_pass http://janome_frontend;
    include sw_proxy_params;
    include snippets/next-image-cache.conf;
    include snippets/security-headers.conf;
  }

  location @nextjs {
    proxy_pass http://janome_frontend;
    include sw_proxy_params;
  }
}
