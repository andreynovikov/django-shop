upstream singer_frontend {
  server 127.0.0.1:4102;
  keepalive 16;
}

server {
  listen *:80;
  server_name  .singer.ru;
  return       301 https://$host$request_uri;
}

server {
  listen       *:443 ssl;
  server_name  www.singer.ru;

  ssl_certificate     /etc/letsencrypt/live/singer.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/singer.ru/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  return       301 https://singer.ru$request_uri;
}

# Production server
server {
  listen       *:443 ssl;
  listen       443 quic;
  http2        on;
  server_name  singer.ru;

  ssl_certificate     /etc/letsencrypt/live/singer.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/singer.ru/privkey.pem;

  include snippets/security-headers.conf;

  access_log   /var/log/nginx/singer.ru_access.log;
  error_log    /var/log/nginx/singer.ru_error.log;

  location /.well-known/ {
    alias /www/singer.ru/.well-known/;
  }

  error_page 404 /404.html;
  error_page 502 /502.html;
  location ~ ^/(404|502)\.html$ {
    root /www/singer.ru/.next/server/pages;
  }

  # temp for Django2 migration
  rewrite ^/products/(.+).html$ /products/$1/ permanent;
  rewrite ^/shop/user/orders/(.*)$ /user/orders/$1 permanent;

  location /media/ {
    alias /www/www.sewing-world.ru/media/;
  }

  location /images/ {
    alias /www/www.sewing-world.ru/media/images/;
  }

  location /_next/static/ {
    alias /www/singer.ru/.docker/static/;
    access_log off;
    expires max;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include snippets/security-headers.conf;
  }

  location / {
    root /www/singer.ru/.docker/public;
    try_files $uri $uri/index.html @nextjs;
  }

  location /_next/image {
    proxy_pass http://singer_frontend;
    include sw_proxy_params;
    proxy_cache next_image;
    proxy_cache_key $host$request_uri$image_format;
    proxy_cache_valid 200 30d;
    proxy_ignore_headers Cache-Control Expires Vary;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status;
    include snippets/security-headers.conf;
  }

  location @nextjs {
    proxy_pass http://singer_frontend;
    include sw_proxy_params;
  }
}
