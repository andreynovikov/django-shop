upstream stage_frontend {
  server 127.0.0.1:4004;
  keepalive 16;
}

server {
  listen       80;
  server_name  stage.sewing-world.ru;
  return       301 https://stage.sewing-world.ru$request_uri;
}

# Pre-production server
server {
  listen       443 ssl;
  listen       443 quic;
  http2        on;
  server_name  stage.sewing-world.ru;

  ssl_certificate     /etc/letsencrypt/live/stage.sewing-world.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stage.sewing-world.ru/privkey.pem;

  add_header Alt-Svc 'h3=":443"; ma=86400';

  location = /unavailable.html {
    root /www/cartzilla.sigalev.ru/.docker/public;
    include snippets/storefront-unavailable.conf;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
  }

  location /.well-known/ {
    alias /www/cartzilla.sigalev.ru/.well-known/;
  }

  rewrite ^/extend_warranty/$      /warranty/extend/ permanent;

  location /media/ {
    alias /www/www.sewing-world.ru/media/;
  }

  location /images/ {
    alias /www/www.sewing-world.ru/media/images/;
  }

  # location /_next/static/ {
  #   alias /www/cartzilla.sigalev.ru/.docker/static/;
  # }

  location / {
    root /www/cartzilla.sigalev.ru/.docker/public;
    try_files $uri $uri/index.html @nextjs;
  }

  location @nextjs {
    proxy_pass http://stage_frontend;
    include sw_proxy_params;
  }
}
