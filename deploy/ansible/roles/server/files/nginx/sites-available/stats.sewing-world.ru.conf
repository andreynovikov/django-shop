server {
  listen *:80;
  server_name  stats.sewing-world.ru;
  return       301 https://stats.sewing-world.ru$request_uri;
}

server {
  listen       *:443 ssl;
  server_name  stats.sewing-world.ru;

  ssl_certificate     /etc/letsencrypt/live/stats.sewing-world.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stats.sewing-world.ru/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  access_log   off;
  error_log    /var/log/nginx/stats.sewing-world.ru_error.log;

  location /.well-known/ {
    alias /www/www.sewing-world.ru/.well-known/;
  }

  location /prometheus {
    include basic_auth;
    proxy_pass http://127.0.0.1:9090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }
}
