# Grafana, and Prometheus' web interface behind basic auth. Enabled with the playbook's "Prometheus" section only
# (server_prometheus, server_nginx_monitoring_sites).
server {
  listen       80;
  server_name  stats.sewing-world.ru;
  return       301 https://stats.sewing-world.ru$request_uri;
}

server {
  listen       443 ssl;
  listen       443 quic;
  http2        on;
  server_name  stats.sewing-world.ru;

  ssl_certificate     /etc/letsencrypt/live/stats.sewing-world.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stats.sewing-world.ru/privkey.pem;

  include snippets/security-headers.conf;

  access_log   off;
  error_log    /var/log/nginx/stats.sewing-world.ru_error.log;

  location /.well-known/ {
    alias /www/www.sewing-world.ru/.well-known/;
  }

  # Prometheus' URLs have this prefix, the path of its --web.external-url (server_prometheus_external_url)
  location /prometheus {
    include basic_auth;
    proxy_pass http://127.0.0.1:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Grafana, with its own login. Its live updates use WebSockets.
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }
}
