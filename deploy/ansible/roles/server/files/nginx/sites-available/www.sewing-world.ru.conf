    return 301 https://$host$request_uri;
  } # managed by Certbot
  if ($host = sewingworld.ru) {
    return 301 https://$host$request_uri;
  } # managed by Certbot
  if ($host = www.sewingworld.ru) {
    return 301 https://$host$request_uri;
  } # managed by Certbot
  if ($host = sewing-world.ru) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  listen       80;
  server_name  .xn----ctbjndawf5a5etb.xn--p1ai;
  server_name  .xn--b1agjdasf1a8d8a.xn--p1ai;
  server_name  .thsm.ru;
  server_name  .7440087.ru;
  server_name  .husqvarna.club;
  server_name  .pfaff.club;
  server_name  .pfaff.shop;
  server_name  .prym.shop;
  server_name  .gutermann.shop;
  server_name  .lapka.ru;
  server_name  .beloshveika.ru;
  server_name  .dimensions.ru;
  server_name  .knittingmachines.ru;
  server_name  .knitting-machines.ru;
  server_name  .sewing.world;
  server_name  .sewing-world.com;
  server_name  .sewingworld.ru;
  server_name  .sewingmachines.ru;
  server_name  www.sewing-world.ru;
  server_name  sewing-world.ru;
  return       301 https://www.sewing-world.ru$request_uri;
