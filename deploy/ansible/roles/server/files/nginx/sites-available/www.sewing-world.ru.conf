server {
  listen       443 ssl;
  server_name  .xn----ctbjndawf5a5etb.xn--p1ai;
  server_name  .xn--b1agjdasf1a8d8a.xn--p1ai;
  server_name  .thsm.ru;
  server_name  .sewingworld.ru;
  server_name  sewing-world.ru;
  ssl_certificate /etc/letsencrypt/live/www.sewing-world.ru/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/www.sewing-world.ru/privkey.pem; # managed by Certbot

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  return       301 https://www.sewing-world.ru$request_uri;
}

server {
  listen       443 ssl;
  listen       443 quic;
  http2        on;
  server_name  www.sewing-world.ru;
  server_name  uno.sewing-world.ru;
  server_name  duo.sewing-world.ru;
  ssl_certificate /etc/letsencrypt/live/www.sewing-world.ru/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/www.sewing-world.ru/privkey.pem; # managed by Certbot

  include snippets/security-headers.conf;

  access_log /var/log/nginx/www.sewing-world.ru_access.log upstream;
  access_log /var/log/nginx/www.sewing-world.ru_5xx.log errored if=$errored;
  access_log /var/log/nginx/www.sewing-world.ru_legacy.jsonl legacy_redirects if=$legacy_uri;
  error_log /var/log/nginx/www.sewing-world.ru_error.log;

  set $legacy_uri $uri;
  rewrite ^/index.html / permanent;
  rewrite ^/articles/sewingmachines/index.html$         /blog/Q/ last;
  rewrite ^/articles/embroidery/index.html$             /blog/R/ last;
  rewrite ^/articles/serger/index.html$                 /blog/S/ last;
  rewrite ^/articles/serger/tension.html$               /blog/T/ last;
  rewrite ^/articles/sewingmachines/$                   /blog/Q/ last;
  rewrite ^/articles/embroidery/$                       /blog/R/ last;
  rewrite ^/articles/serger/$                           /blog/S/ last;
  # back compatibility
  rewrite ^/articles/serger/(.*).(gif|png|jpg)          /media/articles/serger/$1.$2 permanent;
  rewrite ^/articles/sewingmachines/(.*).(gif|png|jpg)  /media/articles/sewingmachines/$1.$2 permanent;
  rewrite ^/blog/wp-content/uploads/(.*).(gif|png|jpg)  /media/blog/$1.$2 permanent;
  rewrite ^/pictures/(.*)                               /images/$1 permanent;
  # temp:
  rewrite ^/shops.html$                                 /stores/ permanent;
  rewrite ^/shops/(\d+).html$                           /stores/$1/ permanent;
  rewrite ^/service.html$                               /service/ permanent;
  rewrite ^/shipping.html$                              /pages/delivery/ permanent;
  rewrite ^/oferta.html$                                /pages/oferta/ permanent;
  rewrite ^/personaldata.html$                          /pages/personaldata/ permanent;
  rewrite ^/articles/$                                  /pages/articles/ permanent;
  rewrite ^/articles/index.html$                        /pages/articles/ permanent;
  rewrite ^/catalog/index.html$                         /catalog/ permanent;
  rewrite ^/catalog/(.*)/index.html$                    /catalog/$1/ permanent;

  # temp for Django2 migration
  rewrite ^/i/b/(.*)$                                   /media/slides/$1 permanent;
  rewrite ^/images/(.*)$                                /media/images/$1 permanent;
  rewrite ^/products/(.+).html$                         /products/$1/ permanent;
  rewrite ^/shop/user/orders/(.*)$                      /user/orders/$1 permanent;
  rewrite ^/extend_warranty/$                           /warranty/extend/ permanent;

  rewrite ^/yandex_54fc37eb003d8618.html                /static/yandex_54fc37eb003d8618.html last;
  rewrite ^/products/(.*)_inc.html                      /products/info/$1/ last;
  set $legacy_uri "";

  client_max_body_size 10M;

  error_page 502 503 504 =503 /unavailable.html;
  location = /unavailable.html {
    root /www/www.sewing-world.ru/.docker/public;
    internal;
    add_header Retry-After 120 always;
    add_header Cache-Control "no-store" always;
    include snippets/security-headers.conf;
  }

  location /cgi-bin/forum.cgi {
    log_not_found off;
    return 404;
  }

  location ~ ^/(catalog\/menu.html|wp-login.php|css\/|jso?\/|ssi\/) {
    log_not_found off;
    return 404;
  }

  location ~ ^/.*/(init|websocket) {
    log_not_found off;
    return 404;
  }

  location /static/ {
    alias /www/www.sewing-world.ru/static/;
    #access_log off;
    access_log /var/log/nginx/www.sewing-world.ru_legacy.jsonl legacy_redirects if=$legacy_uri;
    expires 14d;
    add_header Cache-Control "public";
    include snippets/security-headers.conf;
  }

  location /media/ {
    alias /www/www.sewing-world.ru/media/;
    #access_log off;
    access_log /var/log/nginx/www.sewing-world.ru_legacy.jsonl legacy_redirects if=$legacy_uri;
    expires 14d;
    add_header Cache-Control "public";
    include snippets/security-headers.conf;
  }

  location /.well-known/ {
    alias /www/www.sewing-world.ru/.well-known/;
  }

  location /_next/static/ {
    alias /www/www.sewing-world.ru/.docker/static/;
    #access_log off;
    access_log /var/log/nginx/www.sewing-world.ru_legacy.jsonl legacy_redirects if=$legacy_uri;
    expires max;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include snippets/security-headers.conf;
  }

  # location ~ ^/(api\/v0\/|beru\/|mdbs\/|dbs_nn\/|taxi_kaz\/|taxi_msk\/|taxi_nn\/|taxi_spb\/|sber\/|kassa\/|wiki\/|.*\.csv$) {
  location ~ ^/(beru\/|mdbs\/|dbs_nn\/|taxi_kaz\/|taxi_msk\/|taxi_nn\/|taxi_spb\/|sber\/|kassa\/|.*\.csv$) {
    root /www/www.sewing-world.ru;
    uwsgi_pass unix:///var/run/uwsgi/prod.socket;
    include uwsgi_params;
    uwsgi_read_timeout 65s;
    uwsgi_buffer_size 16k;
    uwsgi_buffers 16 16k;
    # when a client closes the connection then keep the channel to uwsgi open. Otherwise uwsgi throws an IOError
    uwsgi_ignore_client_abort on;
  }

  location / {
    root /www/www.sewing-world.ru/.docker/public;
    try_files $uri @nextjs;
    access_log /var/log/nginx/www.sewing-world.ru_4xx.log errored if=$notfound;
    access_log /var/log/nginx/www.sewing-world.ru_legacy.jsonl legacy_redirects if=$legacy_uri;
  }

  location /_next/image {
    proxy_pass http://sworld_frontend;
    include sw_proxy_params;
    proxy_cache next_image;
    proxy_cache_key $host$request_uri$image_format;
    proxy_cache_valid 200 30d;
    proxy_ignore_headers Cache-Control Expires Vary;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status;
    include snippets/security-headers.conf;
  }

  location @nextjs {
    proxy_pass http://sworld_frontend;
    include sw_proxy_params;
  }
}
