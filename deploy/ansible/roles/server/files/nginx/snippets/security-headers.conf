# A block with an add_header of its own inherits none from the levels above, so such locations include this again.
# Alt-Svc announces HTTP/3 on the listen ... quic of the site.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Alt-Svc 'h3=":443"; ma=86400' always;
