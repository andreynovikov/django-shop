# These paths also serve files that can be replaced at the same URL.
location /media/ {
  alias /www/www.sewing-world.ru/media/;
  include snippets/open-file-cache.conf;
  expires 1h;
}

location /images/ {
  alias /www/www.sewing-world.ru/media/images/;
  include snippets/open-file-cache.conf;
  expires 1h;
}
