# https://samber.github.io/awesome-prometheus-alerts/rules.html

groups:
  - name: Prometheus
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          title: 'Instance {{ $labels.instance }} down'
          description: '{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute.'

  - name: Host
    rules:
      - alert: HostOutOfDiskSpace
        expr: |
          ((node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes < 20
            and ON (instance, device, mountpoint) node_filesystem_readonly == 0)
          * on(instance) group_left (nodename) node_uname_info{nodename=~".+"}
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Host out of disk space (instance {{ $labels.instance }})
          description: "Disk is almost full (< 20% left)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

  - name: PostgreSQL
    rules:
      - alert: PostgresqlDown
        expr: pg_up == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Postgresql down (instance {{ $labels.instance }})
          description: "Postgresql instance is down\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      - alert: PostgresqlTableNotAutoVacuumed
        expr: |
          (pg_stat_user_tables_last_autovacuum > 0) and (time() - pg_stat_user_tables_last_autovacuum) > 60 * 60 * 24 * 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Postgresql table not auto vacuumed (instance {{ $labels.instance }})
          description: "Table {{ $labels.relname }} has not been auto vacuumed for 10 days\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      - alert: PostgresqlTableNotAutoAnalyzed
        expr: |
          (pg_stat_user_tables_last_autoanalyze > 0) and (time() - pg_stat_user_tables_last_autoanalyze) > 24 * 60 * 60 * 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Postgresql table not auto analyzed (instance {{ $labels.instance }})
          description: "Table {{ $labels.relname }} has not been auto analyzed for 10 days\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      - alert: PostgresqlTooManyConnections
        expr: |
          sum by (datname) (pg_stat_activity_count{datname!~"template.*|postgres"}) > pg_settings_max_connections * 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Postgresql too many connections (instance {{ $labels.instance }})
          description: "PostgreSQL instance has too many connections (> 80%).\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      - alert: PostgresqlDeadLocks
        expr: |
          increase(pg_stat_database_deadlocks{datname!~"template.*|postgres"}[1m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Postgresql dead locks (instance {{ $labels.instance }})
          description: "PostgreSQL has dead-locks\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

  - name: Celery
    rules:
      - alert: CeleryWorkerDown
        expr: celery_worker_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A Celery worker is offline
          description: "The Celery worker {{ $labels.hostname }} is offline"
      - alert: CeleryTasksNotExecuting
        expr: |
          sum(
            increase(
              celery_task_succeeded_total{
                name!~"None"
              }[30m]
            )
          ) by (hostname)
        labels:
          severity: critical
        annotations:
          summary: Celery tasks not executing
          description: "No succeeded tasks on {{ $labels.hostname }} for the past 30m"
      - alert: CeleryTaskHighFailRate
        expr: |
          sum(
            increase(
              celery_task_failed_total{
                name!~"None"
              }[10m]
            )
          ) by (namespace, name)
          /
          sum(
            increase(
              celery_task_succeeded_total{
                name!~"None"
              }[10m]
            )
          ) by (namespace, name)
          * 100 > 5
        labels:
          severity: warning
        annotations:
          summary: Celery high task fail rate
          description: "More than 5% tasks failed for the task {{ $labels.namespace }}/{{ $labels.name }} the past 10m"

  - name: SewingWorld
    rules:
      - alert: Import1CRunning
        expr: |
          (sum(celery_task_started_total{name="shop.tasks.import1c"}) by (name)
          - sum(celery_task_succeeded_total{name="shop.tasks.import1c"}) by (name)
          - sum(celery_task_failed_total{name="shop.tasks.import1c"}) by (name)) > 0
        labels:
          severity: info
        annotations:
          summary: 1C import running
