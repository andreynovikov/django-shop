- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Restart timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted

- name: Update exim4 config
  ansible.builtin.command: update-exim4.conf
  changed_when: true

- name: Restart exim4
  ansible.builtin.systemd_service:
    name: exim4
    state: restarted

- name: Restart memcached
  ansible.builtin.systemd_service:
    name: memcached
    state: restarted

# Both handlers listen to "Reload nginx" and run in this order, so a failed nginx -t stops before the reload
- name: Validate nginx before reload
  ansible.builtin.command:
    argv:
      - /usr/sbin/nginx
      - -t
      - -c
      - "{{ server_nginx_directory }}/nginx.conf"
  changed_when: false
  listen: Reload nginx

- name: Reload nginx service
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Reload nginx

# Never restart nftables: before its drop-in is in place, stopping it deletes Docker's rules too
- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
