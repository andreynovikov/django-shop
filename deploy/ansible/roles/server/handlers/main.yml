- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Restart timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted

- name: Update exim4 config
  ansible.builtin.command: update-exim4.conf
  changed_when: true

- name: Restart exim4
  ansible.builtin.systemd_service:
    name: exim4
    state: restarted

- name: Restart memcached
  ansible.builtin.systemd_service:
    name: memcached
    state: restarted

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
