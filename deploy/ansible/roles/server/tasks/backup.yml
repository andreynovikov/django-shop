# "Production server" in "Database backups". The RESTIC_* settings are in the deployment's .env. The repository
# password is vault_restic_password of secrets.yml, or copied from the backup host; main.yml skips this file without
# either.
- name: Install restic
  ansible.builtin.apt:
    name: restic

- name: Create /etc/db-backup
  ansible.builtin.file:
    path: /etc/db-backup
    state: directory
    mode: "0755"

- name: Read the repository password on the backup host
  ansible.builtin.slurp:
    src: /etc/db-backup/restic-password
  # Ansible resolves the host even when the condition skips the task
  delegate_to: "{{ server_backup_password_host or inventory_hostname }}"
  register: restic_password
  when: vault_restic_password is not defined
  no_log: true

- name: Copy the repository password
  ansible.builtin.copy:
    dest: /etc/db-backup/restic-password
    content: "{{ (vault_restic_password | trim) ~ '\n' if vault_restic_password is defined else restic_password.content | b64decode }}"
    owner: "{{ server_app_user }}"
    mode: "0400"
  no_log: true
  diff: false

- name: Install backup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - db_backup@.service
    - db_backup_config@.service
  notify: Reload systemd

- name: Install backup timers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/
    mode: "0644"
  loop:
    - db_backup@.timer
    - db_backup_config@.timer
  notify: Reload systemd

- name: Enable hourly database backups
  ansible.builtin.systemd_service:
    name: db_backup@{{ item }}.timer
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ server_db_backup_deployments }}"

- name: Enable daily config backups
  ansible.builtin.systemd_service:
    name: db_backup_config@{{ item }}.timer
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ server_db_backup_config_deployments }}"
