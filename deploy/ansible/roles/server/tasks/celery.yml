# "Celery setup". The units of an app start once its site is deployed, see sites.yml, and restart when its
# configuration or its site's secrets changed.
- name: Install Celery units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - celery@.service
    - celery_beat@.service
  register: celery_units
  notify: Reload systemd

- name: Create /run/celery on boot
  ansible.builtin.template:
    src: celery.tmpfiles.j2
    dest: /etc/tmpfiles.d/celery.conf
    mode: "0644"

- name: Create /run/celery
  ansible.builtin.file:
    path: /run/celery
    state: directory
    owner: "{{ server_app_user }}"
    group: www-data
    mode: "0755"

- name: Create /etc/celery
  ansible.builtin.file:
    path: /etc/celery
    state: directory
    mode: "0755"

- name: Configure Celery workers
  ansible.builtin.template:
    src: celery_worker.j2
    dest: /etc/celery/{{ item.name }}_worker
    mode: "0644"
  loop: "{{ server_celery_apps }}"
  loop_control:
    label: "{{ item.name }}"
  register: celery_worker_configs

- name: Configure Celery beat
  ansible.builtin.template:
    src: celery_beat.j2
    dest: /etc/celery/{{ item.name }}_beat
    mode: "0644"
  loop: "{{ server_celery_apps }}"
  loop_control:
    label: "{{ item.name }}"
  register: celery_beat_configs

- name: Start Celery workers
  ansible.builtin.systemd_service:
    name: celery@{{ item.name }}.service
    enabled: true
    state: >-
      {{ 'restarted' if celery_units is changed or item.name in changed_configs
         or item.site in backend_changed_sites | default([]) else 'started' }}
    daemon_reload: true
  loop: "{{ server_celery_apps | selectattr('site', 'in', server_deployed_sites) | list }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    changed_configs: "{{ celery_worker_configs.results | select('changed') | map(attribute='item.name') | list }}"

- name: Start Celery beat
  ansible.builtin.systemd_service:
    name: celery_beat@{{ item.name }}.service
    enabled: true
    state: >-
      {{ 'restarted' if celery_units is changed or item.name in changed_configs
         or item.site in backend_changed_sites | default([]) else 'started' }}
    daemon_reload: true
  loop: "{{ server_celery_apps | selectattr('site', 'in', server_deployed_sites) | list }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    changed_configs: "{{ celery_beat_configs.results | select('changed') | map(attribute='item.name') | list }}"

# The health check (manage.py check_health) runs from a systemd timer rather than from beat, so that it raises the
# alarm when Celery, its broker or beat stops. One per site that runs beat.
- name: Install the health check unit
  ansible.builtin.template:
    src: health_check@.service.j2
    dest: /etc/systemd/system/health_check@.service
    mode: "0644"
  notify: Reload systemd

- name: Install the health check timer
  ansible.builtin.copy:
    src: health_check@.timer
    dest: /etc/systemd/system/health_check@.timer
    mode: "0644"
  notify: Reload systemd

- name: Enable the health check
  ansible.builtin.systemd_service:
    name: health_check@{{ item }}.timer
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ server_celery_apps | selectattr('site', 'in', server_deployed_sites) | map(attribute='site') | unique | list }}"

# Its predecessor, which checked the integrations only
- name: Find the integration check timers
  ansible.builtin.find:
    paths: /etc/systemd/system/timers.target.wants
    patterns: "integration_check@*.timer"
    file_type: link
  register: integration_check_timers

- name: Stop the integration check timers
  ansible.builtin.systemd_service:
    name: "{{ item.path | basename }}"
    enabled: false
    state: stopped
  loop: "{{ integration_check_timers.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Remove the integration check units
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item }}
    state: absent
  loop:
    - integration_check@.service
    - integration_check@.timer
  notify: Reload systemd
