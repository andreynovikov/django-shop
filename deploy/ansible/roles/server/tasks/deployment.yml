- name: Create deployment user
  ansible.builtin.user:
    name: deploy
    groups: [docker]
    shell: /bin/sh  # sshd runs the forced command of the key through the login shell
    generate_ssh_key: true
    ssh_key_type: ed25519
  register: created_user

- name: Add deployment user public key to authorized_keys
  ansible.posix.authorized_key:
    user: deploy
    state: present
    key: "{{ created_user.ssh_public_key }}"
    key_options: 'restrict,command="/usr/local/bin/deploy-frontend"'
    comment: github-deploy
    exclusive: true
  when: created_user.ssh_public_key is defined

- name: Create missing storefront directories
  ansible.builtin.command:
    argv:
      - install
      - -d
      - -o
      - "{{ server_www_owner }}"
      - -g
      - www-data
      - -m
      - "0755"
      - --
      - "{{ item.value.directory }}"
    creates: "{{ item.value.directory }}"
  loop: "{{ server_frontend_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Give the service user ownership of storefront assets
  ansible.builtin.file:
    path: "{{ item.value.directory }}/.docker"
    state: directory
    owner: "{{ server_app_user }}"
    group: "{{ server_app_user }}"
    recurse: true
    follow: false
  loop: "{{ server_frontend_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Allow nginx to traverse storefront asset roots
  ansible.builtin.file:
    path: "{{ item.value.directory }}/.docker"
    state: directory
    mode: "0755"
    follow: false
  loop: "{{ server_frontend_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Create the storefront configuration directory
  ansible.builtin.file:
    path: /etc/sworld
    state: directory
    owner: root
    group: root
    mode: "0755"

# The forced deployment command uses only this root-owned Compose file.
- name: Install the shared storefront Compose file
  ansible.builtin.copy:
    src: docker-compose.yaml
    dest: /etc/sworld/storefront-compose.yaml
    owner: root
    group: root
    mode: "0644"

- name: Install frontend deployment script
  ansible.builtin.template:
    src: deploy-frontend.j2
    dest: /usr/local/bin/deploy-frontend
    group: docker
    mode: "0750"
    validate: /bin/sh -n %s
