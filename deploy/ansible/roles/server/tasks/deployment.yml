- name: Create deployment user
  ansible.builtin.user:
    name: deploy
    groups: [docker]
    shell: /bin/sh  # sshd runs the forced command of the key through the login shell
    generate_ssh_key: true
    ssh_key_type: ed25519
  register: created_user

# The private key is the SSH_PRIVATE_KEY secret of the GitHub repository. exclusive drops any other key of the
# account, and the forced command lets the key run only deploy-frontend.
- name: Add deployment user public key to authorized_keys
  ansible.posix.authorized_key:
    user: deploy
    state: present
    key: "{{ created_user.ssh_public_key }}"
    key_options: 'restrict,command="/usr/local/bin/deploy-frontend"'
    comment: github-deploy
    exclusive: true
  when: created_user.ssh_public_key is defined

- name: Create missing storefront directories
  ansible.builtin.command:
    argv:
      - install
      - -d
      - -o
      - "{{ server_www_owner }}"
      - -g
      - www-data
      - -m
      - "0755"
      - --
      - "{{ item.value.directory }}"
    creates: "{{ item.value.directory }}"
  loop: "{{ server_frontend_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# The containers run as the service user, see container-entrypoint.sh and startup.sh on the storefront branches,
# and copy their static files and public/ into .docker for nginx
- name: Give the service user ownership of storefront assets
  ansible.builtin.file:
    path: "{{ item.value.directory }}/.docker"
    state: directory
    owner: "{{ server_app_user }}"
    group: "{{ server_app_user }}"
    recurse: true
    follow: false
  loop: "{{ server_frontend_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Allow nginx to traverse storefront asset roots
  ansible.builtin.file:
    path: "{{ item.value.directory }}/.docker"
    state: directory
    mode: "0755"
    follow: false
  loop: "{{ server_frontend_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Find the storefront configurations
  ansible.builtin.stat:
    path: "{{ item.value.directory }}/.env.storefront"
  loop: "{{ server_frontend_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: storefront_envs

# The deploy account runs Compose but doesn't read the file: the Docker daemon mounts it into the container, where
# the storefront runs as the service user
- name: Let only root and the service user read the storefront configurations
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    owner: root
    group: "{{ server_app_user }}"
    mode: "0640"
  loop: "{{ storefront_envs.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"

- name: Create the storefront configuration directory
  ansible.builtin.file:
    path: /etc/sworld
    state: directory
    owner: root
    group: root
    mode: "0755"

# The forced deployment command uses only this root-owned Compose file.
- name: Install the shared storefront Compose file
  ansible.builtin.copy:
    src: docker-compose.yaml
    dest: /etc/sworld/storefront-compose.yaml
    owner: root
    group: root
    mode: "0644"

# Only root and the docker group, which the deploy account is in, can run it
- name: Install frontend deployment script
  ansible.builtin.template:
    src: deploy-frontend.j2
    dest: /usr/local/bin/deploy-frontend
    group: docker
    mode: "0750"
    validate: /bin/sh -n %s
