# The package starts it on installation, unless the image forbids that with a policy-rc.d
- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Install Docker prune unit
  ansible.builtin.copy:
    src: docker-prune.service
    dest: /etc/systemd/system/
    mode: "0644"
  notify: Reload systemd

- name: Install Docker prune timer
  ansible.builtin.copy:
    src: docker-prune.timer
    dest: /etc/systemd/system/
    mode: "0644"
  notify: Reload systemd

- name: Enable the daily Docker prune timer
  ansible.builtin.systemd_service:
    name: docker-prune.timer
    enabled: true
    state: started
    daemon_reload: true
