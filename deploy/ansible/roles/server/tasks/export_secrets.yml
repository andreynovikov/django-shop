# For export-secrets.sh: reads the secret files that the vault holds (secrets.yml) from a server set up by hand, and
# writes them as JSON to secrets_export_file on this computer. Prints the settings of inventory.yml it finds too.
- name: Check the output file
  ansible.builtin.assert:
    that: secrets_export_file is defined
    fail_msg: Run export-secrets.sh, not this playbook
    quiet: true

- name: List the secret files
  ansible.builtin.set_fact:
    export_backend_sites: "{{ backend_sites }}"
    export_paths: >-
      {{ backend_sites | product(server_app_secrets) | map('join', '/') | map('regex_replace', '^', '/www/') | list
         + server_frontend_sites.values() | map(attribute='directory') | map('regex_replace', '$', '/.env.storefront')
           | list
         + ['/etc/nginx/htpasswd', '/etc/db-backup/restic-password']
         + host_key_types | map('regex_replace', '^', '/etc/ssh/ssh_host_') | map('regex_replace', '$', '_key') | list }}
  vars:
    backend_sites: "{{ (server_uwsgi_apps + server_celery_apps) | map(attribute='site') | unique | list }}"
    host_key_types: [ed25519, ecdsa, rsa]

- name: Find the secret files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ export_paths }}"
  register: export_stats

- name: Read the secret files
  ansible.builtin.slurp:
    src: "{{ item.stat.path }}"
  loop: "{{ export_stats.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"
  register: export_slurps
  no_log: true

- name: Collect the secrets
  ansible.builtin.set_fact:
    export_files: >-
      {{ dict(export_slurps.results | map(attribute='source')
              | zip(export_slurps.results | map(attribute='content') | map('b64decode'))) }}
  no_log: true

- name: Collect the backend secrets
  ansible.builtin.set_fact:
    export_backend: >-
      {{ export_backend | default({})
         | combine({item.0: {item.1: export_files['/www/' ~ item.0 ~ '/' ~ item.1]}}, recursive=true) }}
  loop: "{{ export_backend_sites | product(server_app_secrets) | list }}"
  when: ('/www/' ~ item.0 ~ '/' ~ item.1) in export_files
  no_log: true

# A deployment with the same configuration as its branch's, such as stage, gets it from there
- name: Collect the storefront configurations
  ansible.builtin.set_fact:
    export_storefronts: >-
      {{ export_storefronts | default({}) | combine({item.key: export_files[item.value.directory ~ '/.env.storefront']}) }}
  loop: "{{ server_frontend_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - (item.value.directory ~ '/.env.storefront') in export_files
    - >-
      item.value.branch is not defined or item.value.branch not in server_frontend_sites
      or export_files.get(server_frontend_sites[item.value.branch].directory ~ '/.env.storefront')
         != export_files[item.value.directory ~ '/.env.storefront']
  no_log: true

- name: Collect the ssh host keys
  ansible.builtin.set_fact:
    export_host_keys: "{{ export_host_keys | default({}) | combine({item: export_files['/etc/ssh/ssh_host_' ~ item ~ '_key']}) }}"
  loop: [ed25519, ecdsa, rsa]
  when: ('/etc/ssh/ssh_host_' ~ item ~ '_key') in export_files
  no_log: true

# Not secret, they go into inventory.yml: export-secrets.sh prints them
- name: Read the deploy account's key
  ansible.builtin.slurp:
    src: /home/deploy/.ssh/authorized_keys
  register: export_deploy_keys
  failed_when: false

- name: Read the names of the certificates
  ansible.builtin.command:
    argv: [openssl, x509, -noout, -ext, subjectAltName, -in, "/etc/letsencrypt/live/{{ item }}/cert.pem"]
  loop: "{{ server_certificates.keys() | list }}"
  register: export_certificates
  changed_when: false
  failed_when: false
  check_mode: false

- name: Collect the certificate aliases
  ansible.builtin.set_fact:
    export_aliases: >-
      {{ export_aliases | default({})
         | combine({item.item: item.stdout | lower | regex_findall('dns:([a-z0-9.*-]+)') | reject('eq', item.item) | list}) }}
  loop: "{{ export_certificates.results | selectattr('rc', 'eq', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Write the secrets for export-secrets.sh
  ansible.builtin.copy:
    dest: "{{ secrets_export_file }}"
    content: >-
      {{ {'vault_backend_files': export_backend | default({}),
          'vault_storefront_env': export_storefronts | default({}),
          'vault_ssh_host_keys': export_host_keys | default({})}
         | combine({'vault_nginx_htpasswd': export_files['/etc/nginx/htpasswd']}
                   if '/etc/nginx/htpasswd' in export_files else {})
         | combine({'vault_restic_password': export_files['/etc/db-backup/restic-password'] | trim}
                   if '/etc/db-backup/restic-password' in export_files else {})
         | combine({'inventory': {'server_frontend_deploy_ssh_public_key': frontend_key,
                                  'server_backend_deploy_ssh_public_key': backend_key,
                                  'server_certificate_aliases': export_aliases | default({})}})
         | to_json }}
    mode: "0600"
  vars:
    # The keys of the deploy account by their forced commands, without their options and comments
    deploy_keys: "{{ (export_deploy_keys.content | default('') | b64decode).splitlines() }}"
    key_pattern: '(ssh-|ecdsa-)[a-z0-9-]+ [A-Za-z0-9+/=]+'
    frontend_key: >-
      {{ deploy_keys | select('search', '/deploy-frontend"') | map('regex_search', key_pattern) | select | first
         | default('') }}
    backend_key: >-
      {{ deploy_keys | select('search', '/deploy-backend"') | map('regex_search', key_pattern) | select | first
         | default('') }}
  delegate_to: localhost
  become: false
  no_log: true
