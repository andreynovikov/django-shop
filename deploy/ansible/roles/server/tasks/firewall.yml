# "Firewall". Keep an ssh session open on the first run, a mistake here can lock everybody out.
- name: Install nftables
  ansible.builtin.apt:
    name: nftables

- name: Configure the firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload nftables

- name: Create the nftables drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    mode: "0755"

- name: Keep Docker's rules when nftables stops
  ansible.builtin.copy:
    src: nftables.service.conf
    dest: /etc/systemd/system/nftables.service.d/docker.conf
    mode: "0644"
  notify: Reload systemd

- name: Enable the firewall
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
    daemon_reload: true
