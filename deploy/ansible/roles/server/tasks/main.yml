# Sections of deploy/README.md. "PostgreSql setup" is skipped, the database runs on a separate server.
- name: Server setup
  ansible.builtin.import_tasks: server.yml
  tags: server

- name: Two factor authentication
  ansible.builtin.import_tasks: two_factor.yml
  tags: 2fa

- name: Firewall
  ansible.builtin.import_tasks: firewall.yml
  tags: firewall

- name: Nginx setup
  ansible.builtin.import_tasks: nginx.yml
  tags: nginx

- name: TLS certificates
  ansible.builtin.import_tasks: certbot.yml
  tags: certbot

# uwsgi.yml and celery.yml need to know which sites are deployed
- name: Environment setup
  ansible.builtin.import_tasks: sites.yml
  tags: [sites, uwsgi, celery]

- name: UWSGI setup
  ansible.builtin.import_tasks: uwsgi.yml
  tags: uwsgi

- name: Celery setup
  ansible.builtin.import_tasks: celery.yml
  tags: celery

- name: Node.js setup
  ansible.builtin.import_tasks: node.yml
  tags: node

- name: Database backups
  ansible.builtin.import_tasks: backup.yml
  tags: backup

- name: Log rotation
  ansible.builtin.import_tasks: logrotate.yml
  tags: logrotate
