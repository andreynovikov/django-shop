# The monitoring sites go with the "Prometheus" section: enabled with it, disabled without it
- name: Add the monitoring sites
  ansible.builtin.set_fact:
    nginx_sites_enabled: "{{ server_nginx_sites_enabled + (server_nginx_monitoring_sites if server_prometheus | bool else []) }}"
    nginx_sites_disabled: "{{ server_nginx_sites_disabled + ([] if server_prometheus | bool else server_nginx_monitoring_sites) }}"

- name: Check nginx site names
  ansible.builtin.assert:
    that:
      - item is match('^[a-zA-Z0-9][a-zA-Z0-9_.-]*$')
      - "'..' not in item"
      - item not in nginx_sites_enabled or item not in nginx_sites_disabled
      - item not in nginx_sites_enabled or item not in server_nginx_sites_removed
    quiet: true
  loop: "{{ nginx_sites_enabled + nginx_sites_disabled + server_nginx_sites_removed }}"

- name: Install the bundled nginx configuration
  ansible.builtin.copy:
    src: nginx/
    dest: "{{ server_nginx_directory }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
    backup: true
  notify: Reload nginx

# Read on every request, so nothing reloads
- name: Install the basic auth passwords
  ansible.builtin.copy:
    dest: "{{ server_nginx_directory }}/htpasswd"
    content: "{{ vault_nginx_htpasswd }}"
    owner: root
    group: www-data
    mode: "0640"
    backup: true
  when: vault_nginx_htpasswd is defined
  no_log: true
  diff: false

- name: Disable nginx sites
  ansible.builtin.file:
    path: "{{ server_nginx_directory }}/sites-enabled/{{ item }}"
    state: absent
  loop: "{{ nginx_sites_disabled + server_nginx_sites_removed }}"
  notify: Reload nginx

- name: Remove retired nginx site configurations
  ansible.builtin.file:
    path: "{{ server_nginx_directory }}/sites-available/{{ item }}"
    state: absent
  loop: "{{ server_nginx_sites_removed }}"
  notify: Reload nginx

# Each enabled site waits for the certificates its file names, nginx doesn't start without them
- name: Enable the sites and get their certificates
  ansible.builtin.import_tasks: certificates.yml

# Site fragments cannot be checked alone: upstreams, maps and snippets are shared.
- name: Validate the complete nginx configuration
  ansible.builtin.command:
    argv:
      - /usr/sbin/nginx
      - -t
      - -c
      - "{{ server_nginx_directory }}/nginx.conf"
  changed_when: false
  when: not ansible_check_mode

# The sites are served from here on, not only at the end of the run
- name: Apply the nginx configuration
  ansible.builtin.meta: flush_handlers
