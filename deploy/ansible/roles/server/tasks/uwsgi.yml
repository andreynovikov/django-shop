# The apps' ini files are copied from the old server into /etc/uwsgi/apps-available by hand, without links in
# apps-enabled.
#
# The units need /run/uwsgi, not /var/run/uwsgi. systemd rewrites the path of the socket unit to /run, then uWSGI does
# not recognize the socket it is given as its --socket and fails to bind that a second time.
- name: Install uWSGI units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/
    mode: "0644"
  loop:
    - uwsgi@.socket
    - uwsgi@.service
  notify: Reload systemd

- name: Enable uWSGI apps
  ansible.builtin.systemd_service:
    name: uwsgi@{{ item.0 }}.{{ item.1 }}
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ server_uwsgi_apps | product(['socket', 'service']) | list }}"
