# Server setup from deploy/README.md: packages, system configuration and the files whose contents it lists.
# README.md tells how to run it, the first run on a new server included, and what is left to do by hand.

# The backup host goes first, the production server copies the repository password from it.
- name: Backup host
  hosts: backup
  become: true
  force_handlers: true
  roles:
    - role: backup_host
      tags: backup_host

# Handlers run also when a later task fails, so that a run that stops after changing nginx, for example, still
# reloads it: the next run finds nothing to change and wouldn't.
- name: Production server
  hosts: production
  become: true
  force_handlers: true
  roles:
    - server
