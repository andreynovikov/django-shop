name: ${NAME}
services:
  app:
    container_name: nextjs-${NAME}
    image: ${IMAGE}
    build:
      context: ./
      target: runner
      args:
        entity: sworld
      tags:
        - sworld
    volumes:
      - ./.docker/:/app/.docker/
      - ./templates/:/app/templates/
    network_mode: bridge
    ports:
      - "127.0.0.1:${PORT}:3000/tcp"
    environment:
      NODE_ENV: production
      STOREFRONT_PROCESS_NAME: "${NAME}"
      STOREFRONT_UID: "${STOREFRONT_UID:-}"
      STOREFRONT_GID: "${STOREFRONT_GID:-}"
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: unixgram:///run/systemd/journal/dev-log
        tag: "{{.Name}}/{{.ID}}"
