<!doctype html>
<!--
  Shown by nginx when the frontend container doesn't answer (502/503/504).
  startup.sh copies public/ into the .docker/ volume, so the file stays there while the container is stopped.
  Everything is inline: nginx serves this page for any URL, and nothing else may be reachable.
-->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Сайт скоро вернётся - Singer</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --red: #d6083b;
    --red-dark: #b60732;
    --text: #71655c;
    --muted: rgb(113 101 92 / .75);
    --bg: #fff;
    --fabric: #efe6dc;
    --strip: 240px;
    --cut: 4.2s;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 helvetica, arial, sans-serif;
    text-align: center;
  }
  main { width: 100%; max-width: 480px; }
  .logo {
    display: block;
    width: min(323px, 100%);
    margin: 0 auto;
    border-radius: 6px;
    background: var(--red);
  }
  .logo img { display: block; width: 100%; height: auto; }

  /* Scissors snip along the chalk line of a strip of fabric, which parts behind them */
  .strip {
    position: relative;
    width: var(--strip);
    height: 18px;
    margin: 64px auto 52px;
    border-radius: 2px;
    background:
      repeating-linear-gradient(90deg, #b7a99c 0 6px, transparent 6px 10px) 0 50% / 100% 1px no-repeat,
      var(--fabric);
    animation: fade var(--cut) linear infinite;
  }
  .gap { /* the cut, in the page colour */
    position: absolute;
    left: -1px;
    top: 7.5px;
    width: 0;
    height: 3px;
    background: var(--bg);
    animation: cut var(--cut) linear infinite;
  }
  .scissors {
    position: absolute;
    left: -32px; /* the pivot sits on the strip's start */
    top: -11px;
    width: 64px;
    height: 40px;
    overflow: visible;
    animation: advance var(--cut) linear infinite;
  }
  .blade-a, .blade-b {
    transform-box: view-box;
    transform-origin: 32px 20px;
    animation: snip .35s ease-in-out infinite;
  }
  .blade-b { animation-name: snip-b; }
  @keyframes snip {
    0%, 100% { transform: rotate(-16deg); }
    50% { transform: rotate(-1deg); }
  }
  @keyframes snip-b {
    0%, 100% { transform: rotate(16deg); }
    50% { transform: rotate(1deg); }
  }
  @keyframes advance {
    0% { transform: translateX(0); }
    84%, 100% { transform: translateX(calc(var(--strip) + 2px)); }
  }
  @keyframes cut {
    0% { width: 0; }
    84%, 100% { width: calc(var(--strip) + 2px); }
  }
  @keyframes fade {
    0%, 88% { opacity: 1; }
    100% { opacity: 0; }
  }

  h1 { margin: 0 0 12px; font-size: 1.75rem; line-height: 1.25; font-weight: 400; color: var(--red); }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9375rem; }
  a { color: var(--red); text-decoration: none; white-space: nowrap; }
  a:hover { color: var(--red-dark); text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    .strip, .gap, .scissors, .blade-a, .blade-b { animation: none; }
    .gap { width: 50%; }
    .scissors { transform: translateX(calc(var(--strip) / 2)); }
  }
</style>
</head>
