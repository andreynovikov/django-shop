-->

  :root {
    --green: #10a04e;
    --link: #337ab7;
    --text: #212529;
    --muted: #6c757d;
    --bg: #fff;
    --wood: #d9b48a;
    --track: 286px;
    --spool: 48px;
    --roll: 3.2s;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  main { width: 100%; max-width: 480px; }
  .logo { display: block; width: min(280px, 100%); height: auto; margin: 0 auto; }
  .logo .fill { fill: var(--green); }
  .logo .line { fill: none; stroke: var(--green); stroke-linecap: round; stroke-linejoin: round; }

  /* A spool rolls across and lays its thread, then rolls back and winds it up */
  .track {
    position: relative;
    width: var(--track);
    height: var(--spool);
    margin: 48px auto 40px;
  }
  .track::before { /* the table edge */
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    border-top: 1px dashed #e3e6ea;
  }
  .thread {
    position: absolute;
    left: calc(var(--spool) / 2);
    bottom: 0;
    width: 0;
    height: 2px;
    border-radius: 1px;
    background: var(--green);
    animation: lay var(--roll) infinite alternate;
  }
  .spool {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--spool);
    height: var(--spool);
    animation: roll var(--roll) infinite alternate;
  }
  /* distance = track - spool = 238px; turn = 238 / (π · 48) · 360° ≈ 568° */
  @keyframes roll {
    0%, 8% { transform: translateX(0) rotate(0); animation-timing-function: ease-in-out; }
    92%, 100% { transform: translateX(238px) rotate(568deg); }
  }
  @keyframes lay {
    0%, 8% { width: 0; animation-timing-function: ease-in-out; }
    92%, 100% { width: 238px; }
  }

  h1 { margin: 0 0 12px; font-size: 1.75rem; line-height: 1.25; font-weight: 600; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9375rem; }
  a { color: var(--link); text-decoration: none; white-space: nowrap; }
  a:hover { color: var(--green); }

  @media (prefers-reduced-motion: reduce) {
    .thread, .spool { animation: none; }
    .thread { width: 238px; }
    .spool { transform: translateX(238px); }
  }
</style>

<script>
  // Reload once the site answers again. Not on this file's own URL, which the running site serves with 200.
  (function () {
    if (!window.fetch || /\/unavailable\.html$/.test(location.pathname)) return;
    var delay = 10000;
    function check() {
      fetch(location.href, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        if (r.status < 500) location.reload(); else later();
      }, later);
    }
    function later() {
      delay = Math.min(delay * 1.5, 60000);
      setTimeout(check, delay);
    }
    setTimeout(check, delay);
  })();
</script>
