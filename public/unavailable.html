-->

<style>
  :root {
    --red: #df0623;
    --red-dark: #ad051b;
    --text: #2b3445;
    --muted: #7d879c;
    --bg: #fff;
    --embroider: 6s;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  main { width: 100%; max-width: 480px; }
  .logo { display: block; width: min(260px, 100%); height: auto; margin: 0 auto; fill: var(--red); }

  /* A heart is embroidered in a hoop, stitch by stitch, then filled in */
  .hoop { display: block; width: 160px; height: 160px; margin: 36px auto 28px; }
  .reveal {
    fill: none;
    stroke: #fff;
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: reveal var(--embroider) linear infinite;
  }
  .satin { fill: var(--red); opacity: 0; animation: satin var(--embroider) ease-out infinite; }
  .heart { transform-origin: 80px 80px; animation: heart var(--embroider) ease-in-out infinite; }
  @keyframes reveal {
    0%, 4% { stroke-dashoffset: 100; }
    62%, 100% { stroke-dashoffset: 0; }
  }
  @keyframes satin {
    0%, 64% { opacity: 0; }
    74%, 90% { opacity: .2; }
    100% { opacity: 0; }
  }
  @keyframes heart {
    0%, 66% { transform: scale(1); opacity: 1; }
    71% { transform: scale(1.08); }
    76%, 90% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
  }

  h1 { margin: 0 0 12px; font-size: 1.75rem; line-height: 1.25; font-weight: 600; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9375rem; }
  a { color: var(--red); text-decoration: none; white-space: nowrap; }
  a:hover { color: var(--red-dark); }

  @media (prefers-reduced-motion: reduce) {
    .reveal, .satin, .heart { animation: none; }
    .reveal { stroke-dashoffset: 0; }
    .satin { opacity: .2; }
  }
</style>
</head>

<script>
  // Reload once the site answers again. Not on this file's own URL, which the running site serves with 200.
  (function () {
    if (!window.fetch || /\/unavailable\.html$/.test(location.pathname)) return;
    var delay = 10000;
    function check() {
      fetch(location.href, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        if (r.status < 500) location.reload(); else later();
      }, later);
    }
    function later() {
      delay = Math.min(delay * 1.5, 60000);
      setTimeout(check, delay);
    }
    setTimeout(check, delay);
  })();
</script>
