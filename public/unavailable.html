-->

<style>
  :root {
    --red: #e63946;
    --red-dark: #c62835;
    --text: #212529;
    --heading: #343a40;
    --muted: #868e96;
    --bg: #fff;
    --sew: 5s;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  main { width: 100%; max-width: 480px; }
  .logo { display: block; width: min(300px, 100%); height: auto; margin: 0 auto; fill: #ef1111; }

  /* A needle sews a button on with a cross stitch: hole 1 to 3 on top, under to 4, then 4 to 2 */
  .button { display: block; width: 120px; height: 120px; margin: 36px auto 28px; overflow: visible; }
  .stitch {
    fill: none;
    stroke: #fff8ec;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
  .stitch.a { animation: stitch-a var(--sew) linear infinite; }
  .stitch.b { animation: stitch-b var(--sew) linear infinite; }
  .needle { animation: needle var(--sew) linear infinite; }
  @keyframes stitch-a {
    0%, 6% { stroke-dashoffset: 1; opacity: 1; }
    36%, 92% { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  @keyframes stitch-b {
    0%, 54% { stroke-dashoffset: 1; opacity: 1; }
    84%, 92% { stroke-dashoffset: 0; opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 0; }
  }
  /* The needle's tip is at its origin; it comes up through a hole, crosses the button and goes down the next one */
  @keyframes needle {
    0% { transform: translate(49px, 49px) rotate(0); opacity: 0; }
    6% { transform: translate(49px, 49px) rotate(0); opacity: 1; }
    36% { transform: translate(71px, 71px) rotate(0); opacity: 1; }
    42% { transform: translate(71px, 71px) rotate(0); opacity: 0; }
    48% { transform: translate(49px, 71px) rotate(-90deg); opacity: 0; }
    54% { transform: translate(49px, 71px) rotate(-90deg); opacity: 1; }
    84% { transform: translate(71px, 49px) rotate(-90deg); opacity: 1; }
    90%, 100% { transform: translate(71px, 49px) rotate(-90deg); opacity: 0; }
  }
  .wobble { transform-origin: 60px 60px; animation: wobble var(--sew) ease-in-out infinite; }
  @keyframes wobble {
    0%, 86%, 100% { transform: rotate(0); }
    89% { transform: rotate(-6deg); }
    92% { transform: rotate(4deg); }
    95% { transform: rotate(-2deg); }
  }

  h1 { margin: 0 0 12px; font-size: 1.75rem; line-height: 1.25; font-weight: 600; color: var(--heading); }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9375rem; }
  a { color: var(--red); text-decoration: none; white-space: nowrap; }
  a:hover { color: var(--red-dark); }

  @media (prefers-reduced-motion: reduce) {
    .stitch.a, .stitch.b, .needle, .wobble { animation: none; }
    .stitch { stroke-dashoffset: 0; }
    .needle { display: none; }
  }
</style>
</head>

<script>
  // Reload once the site answers again. Not on this file's own URL, which the running site serves with 200.
  (function () {
    if (!window.fetch || /\/unavailable\.html$/.test(location.pathname)) return;
    var delay = 10000;
    function check() {
      fetch(location.href, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        if (r.status < 500) location.reload(); else later();
      }, later);
    }
    function later() {
      delay = Math.min(delay * 1.5, 60000);
      setTimeout(check, delay);
    }
    setTimeout(check, delay);
  })();
</script>
