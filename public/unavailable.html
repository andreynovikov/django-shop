  Everything is inline: nginx serves this page for any URL, and nothing else may be reachable.
-->

<style>
  :root {
    --navy: #21426b;
    --blue: #3163ad;
    --thread: #ef7f1a;
    --text: #2b3445;
    --muted: #7d879c;
    --bg: #fff;
    --stitch: 22px; /* 14px stitch + 8px gap */
    --stitches: 13;
    --beat: .4s;    /* one needle stroke = one stitch */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  main { width: 100%; max-width: 480px; }
  .logo { display: block; width: min(340px, 100%); height: auto; margin: 0 auto; }
  .logo .navy { fill: var(--navy); }
  .logo .blue { fill: var(--blue); }

  /* The seam: stitches appear one by one behind a bobbing needle */
  .seam {
    position: relative;
    width: calc(var(--stitch) * var(--stitches));
    height: 3px;
    margin: 72px auto 40px;
    animation: fade calc(var(--beat) * (var(--stitches) + 2)) linear infinite;
  }
  .seam::before { /* faint chalk line where the seam will go */
    content: "";
    position: absolute;
    inset: 1px 0 auto;
    border-top: 1px dashed #e3e9ef;
  }
  .stitches {
    position: absolute;
    left: 0;
    top: 0;
    height: 3px;
    width: 0;
    border-radius: 2px;
    background: repeating-linear-gradient(90deg, var(--thread) 0 14px, transparent 14px var(--stitch));
    animation: sew calc(var(--beat) * (var(--stitches) + 2)) linear infinite;
  }
  .needle {
    position: absolute;
    left: 100%;
    bottom: -3px;
    width: 10px;
    height: 56px;
    margin-left: -5px;
    overflow: visible;
    animation: bob var(--beat) ease-in-out infinite;
  }
  @keyframes sew {
    0% { width: 0; animation-timing-function: steps(13, end); }
    86.667% { width: calc(var(--stitch) * var(--stitches)); }
    100% { width: calc(var(--stitch) * var(--stitches)); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-16px); }
  }
  @keyframes fade {
    0%, 88% { opacity: 1; }
    100% { opacity: 0; }
  }

  h1 { margin: 0 0 12px; font-size: 1.75rem; line-height: 1.25; font-weight: 600; color: var(--navy); }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: .9375rem; }
  a { color: var(--blue); text-decoration: none; white-space: nowrap; }
  a:hover { color: var(--thread); }

  @media (prefers-reduced-motion: reduce) {
    .seam, .stitches, .needle { animation: none; }
    .stitches { width: 100%; }
    .needle { display: none; }
  }
</style>
</head>

<script>
  // Reload once the site answers again. Not on this file's own URL, which the running site serves with 200.
  (function () {
    if (!window.fetch || /\/unavailable\.html$/.test(location.pathname)) return;
    var delay = 10000;
    function check() {
      fetch(location.href, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        if (r.status < 500) location.reload(); else later();
      }, later);
    }
    function later() {
      delay = Math.min(delay * 1.5, 60000);
      setTimeout(check, delay);
    }
    setTimeout(check, delay);
  })();
</script>
